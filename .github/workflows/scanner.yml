name: VWAP RSI Scanner

on:
  schedule:
    - cron: '*/5 13-22 * * 1-5'   # UTC 13-22 = EST 9AM-6PM
  workflow_dispatch:

jobs:
  scan-pass-1:
    name: Scan Pass 1
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          EXTRA_TICKERS:  ${{ secrets.EXTRA_TICKERS }}
          DB_PATH:        docs/signals.db
        run: python scanner.py

      - name: Push DB to Render disk via SCP
        env:
          RENDER_SSH_KEY:  ${{ secrets.RENDER_SSH_KEY }}
          RENDER_SSH_HOST: ${{ secrets.RENDER_SSH_HOST }}
          RENDER_SSH_USER: ${{ secrets.RENDER_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$RENDER_SSH_KEY" > ~/.ssh/render_key
          chmod 600 ~/.ssh/render_key
          ssh-keyscan -H "$RENDER_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/render_key -o StrictHostKeyChecking=no \
            docs/signals.db \
            "$RENDER_SSH_USER@$RENDER_SSH_HOST:/opt/render/project/src/docs/signals.db"
          echo "DB pushed to Render ✅"

  scan-pass-2:
    name: Scan Pass 2 (offset +2 min)
    runs-on: ubuntu-latest
    needs: scan-pass-1
    permissions:
      contents: write

    steps:
      - name: Wait 2 minutes
        run: sleep 120

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          EXTRA_TICKERS:  ${{ secrets.EXTRA_TICKERS }}
          DB_PATH:        docs/signals.db
        run: python scanner.py

      - name: Push DB to Render disk via SCP
        env:
          RENDER_SSH_KEY:  ${{ secrets.RENDER_SSH_KEY }}
          RENDER_SSH_HOST: ${{ secrets.RENDER_SSH_HOST }}
          RENDER_SSH_USER: ${{ secrets.RENDER_SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$RENDER_SSH_KEY" > ~/.ssh/render_key
          chmod 600 ~/.ssh/render_key
          ssh-keyscan -H "$RENDER_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/render_key -o StrictHostKeyChecking=no \
            docs/signals.db \
            "$RENDER_SSH_USER@$RENDER_SSH_HOST:/opt/render/project/src/docs/signals.db"
          echo "DB pushed to Render ✅"
